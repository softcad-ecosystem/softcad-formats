name: Public format-reference checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: |
          for f in test_*.py; do python "$f"; done
      - name: JavaScript tests
        run: |
          for f in test_*.cjs; do node "$f"; done
